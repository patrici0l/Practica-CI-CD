name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Correr pruebas
        run: npm test

  build-push:
    needs: build-test
    runs-on: ubuntu-latest
    # Se necesitan permisos de escritura para publicar paquetes en GHCR
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Definir tags de la imagen
        id: tags
        run: |
          echo "sha_tag=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Construir imagen Docker para escaneo
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.tags.outputs.sha_tag }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '1'

      - name: Publicar imagen con hash del commit
        run: docker push "${{ steps.tags.outputs.sha_tag }}"

      - name: Publicar imagen latest
        run: docker push "${{ steps.tags.outputs.latest_tag }}"
